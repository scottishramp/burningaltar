baseURL = "https://burningaltar.com/"
theme = "hugo-bearblog"
title = "R&D & R&R"
author = "Brian Herbert"
copyright = "Copyright © 2025–2026, Brian Herbert."
locale = "en-US"
enableRobotsTXT = true
timeZone = "America/Chicago"

# Bear-like URLs: posts live at /:slug/
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  description = "Writing by Brian Herbert."
  title = "R&D & R&R"
  enablePostNavigator = true
  hideMadeWithLine = true

# Closed tag vocabulary. Add a tag here and under content/tags/<slug>/
# before using it on a post. Do not reuse these slugs as post slugs.
[[params.tagVocab]]
  slug = "ai"
  name = "AI"
[[params.tagVocab]]
  slug = "family"
  name = "Family"
[[params.tagVocab]]
  slug = "health"
  name = "Health"
[[params.tagVocab]]
  slug = "philosophy"
  name = "Philosophy"
[[params.tagVocab]]
  slug = "theology"
  name = "Theology"

[markup]
  [markup.highlight]
    style = "friendly"
    lineNos = true
    lineNumbersInTable = false
    codeFences = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"
